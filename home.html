<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundimanga - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-logo">🌙 Mundimanga</div>
        <div class="header-search">
            <input type="text" placeholder="Pesquisar usuários, posts..." id="searchInput">
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleMessages()" title="Mensagens">
                💬
                <span class="notification-badge" id="msgBadge" style="display: none;">0</span>
            </button>
            <button class="btn-icon" onclick="toggleNotifications()" title="Notificações">
                🔔
                <span class="notification-badge" id="notifBadge" style="display: none;">0</span>
            </button>
            <button class="btn-logout" onclick="sair()">Sair</button>
        </div>
    </header>

    <!-- MAIN APP -->
    <div id="appContainer" class="app-container active">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Menu</div>
                <div class="sidebar-item active" onclick="showFeed()">
                    📰 Feed
                </div>
                <div class="sidebar-item" onclick="showExplore()">
                    🔍 Explorar
                </div>
                <div class="sidebar-item" onclick="showProfile()">
                    👤 Perfil
                </div>
                <div class="sidebar-item" onclick="showMessages()">
                    💬 Mensagens
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Categorias</div>
                <div class="sidebar-item" onclick="filterByTag('anime')">
                    ✨ Anime
                </div>
                <div class="sidebar-item" onclick="filterByTag('manga')">
                    📖 Manga
                </div>
                <div class="sidebar-item" onclick="filterByTag('review')">
                    ⭐ Reviews
                </div>
                <div class="sidebar-item" onclick="filterByTag('discussao')">
                    💬 Discussão
                </div>
            </div>
        </aside>

        <!-- MAIN FEED -->
        <main class="main-feed" id="mainFeed">
            <!-- COMPOSER -->
            <div class="composer-box">
                <div class="composer-header">
                    <div class="avatar" id="currentUserAvatar">U</div>
                    <div style="flex: 1;">
                        <textarea class="composer-textarea" id="postContent" placeholder="Qual é sua opinião sobre anime/mangá?" maxlength="200"></textarea>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
                            <span id="charCount">0</span>/200 | 📷 até 20MB | 🎬 até 50MB
                        </div>
                    </div>
                </div>

                <div id="attachmentPreview" class="composer-attachments"></div>

                <div class="composer-actions">
                    <div class="composer-buttons">
                        <button class="btn-action" onclick="triggerImageUpload()">
                            🖼️ Foto
                        </button>
                        <button class="btn-action" onclick="triggerVideoUpload()">
                            🎬 Vídeo
                        </button>
                    </div>
                    <button class="btn-post" onclick="createPost()" id="postBtn">Postar</button>
                </div>

                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <input type="file" id="videoInput" accept="video/mp4" style="display: none;">
            </div>

            <!-- POSTS FEED -->
            <div id="postsContainer"></div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="right-sidebar">
            <h3>🔥 Tendências</h3>
            <div id="trendingContainer"></div>
        </aside>
    </div>

    <!-- MESSAGES MODAL -->
    <div id="messagesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💬 Mensagens</h2>
                <button class="btn-close" onclick="closeModal('messagesModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="messages-container">
                    <div class="conversation-list" id="conversationList"></div>
                    <div class="message-window" id="messageWindow">
                        <div class="message-header">
                            <span id="chatPartnerName"></span>
                            <button class="btn-close" onclick="closeMessageWindow()">✕</button>
                        </div>
                        <div class="messages-list" id="messagesList"></div>
                        <div class="message-input-area">
                            <input type="text" class="message-input" id="messageInput" placeholder="Digite sua mensagem...">
                            <button class="btn-send" onclick="sendMessage()">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
