<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mundimanga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>cliff™ Mundimanga</h1>
            
            <div class="form-group">
                <label>UsuÃ¡rio</label>
                <input type="text" id="usuario" placeholder="Digite seu usuÃ¡rio" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="off">
            </div>
            
            <button class="btn-login" onclick="entrar()">Entrar</button>
        </div>
    </div>

    <script>
        // Apenas as funÃ§Ãµes de login, sem redirecionamento automÃ¡tico
        let currentUser = null;

        function entrar() {
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!usuario || !senha) {
                alert('Preencha todos os campos');
                return;
            }

            currentUser = {
                id: usuario.toLowerCase(),
                nome: usuario,
                isBot: false,
                createdAt: new Date().toISOString()
            };

            localStorage.setItem('mundimanga_user', JSON.stringify(currentUser));
            
            // TransiÃ§Ã£o para home
            window.location.href = 'home.html';
        }

        // Verificar se jÃ¡ estÃ¡ logado ao carregar login.html
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('mundimanga_user');
            if (saved) {
                // Se jÃ¡ estÃ¡ logado, redireciona para home
                window.location.href = 'home.html';
            }
        });
    </script>
</body>
</html>
